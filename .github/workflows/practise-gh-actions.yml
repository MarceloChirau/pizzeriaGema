name: practise github actions
run-name: ${{ github.actor }} is learning Github Actions
on:
  push:
    branches:
      - 'feature/gh-actions'
jobs:
  my_first_job:
    name: My first job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version:  '20'

      - name: Install dependecies
        run: npm ci    


