<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="format-detection" content="telephone=no">

  <title>Pizzeria Gema | Registracija</title>
  <meta name="description" content="Kreirajte svoj Pizzeria Gema račun za brže naručivanje i praćenje vaših omiljenih pizza.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="auth-page">

  <header class="top-bar">
    <a href="index.html" class="brand-link">
      <h1>Pizzeria Gema</h1>
    </a>

    <div class="nav-actions">
      <a href="tel:+38544521036" class="call-button" aria-label="Call Pizzeria Gema">
        <i class="fa-solid fa-phone"></i>
        <span class="phone-number">+385 44 521 036</span>
      </a>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="form-container">

      <div class="form-header">
        <h2>Kreirajte račun</h2>
        <p>Registrirajte se za brže naručivanje</p>
        <div class="divider"></div>
      </div>

      <form id="signUpForm">

        <div class="input-group">
          <label for="name">Ime / Name</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-user input-icon"></i>
            <input id="name" name="name" type="text" placeholder="Unesite vaše ime" required autocomplete="username">
          </div>
        </div>

        <div class="input-group">
          <label for="email">Email</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input id="email" name="email" type="email" placeholder="vas@email.com" required autocomplete="email">
          </div>
        </div>

        <div class="input-group">
          <label for="phone">Broj telefona / Phone</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-phone input-icon"></i>
            <input id="phone" name="phoneNumber" type="tel" placeholder="+385 xx xxx xxxx" required autocomplete="tel">
          </div>
        </div>

        <div class="input-group">
          <label for="address">Adresa dostave / Delivery Address</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-location-dot input-icon"></i>
            <input id="address" name="address" type="text" placeholder="Gdje dostaviti..." required autocomplete="street-address">
          </div>
        </div>

        <div class="input-group">
          <label for="password">Lozinka / Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input id="password" name="password" type="password" placeholder="••••••••" required minlength="5" autocomplete="new-password">
          </div>
        </div>

        <div class="input-group">
          <label for="confirmPassword">Potvrdi lozinku / Confirm Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input id="confirmPassword" name="confirmPassword" type="password" placeholder="••••••••" required minlength="5" autocomplete="new-password">
          </div>
        </div>

        <div class="btns-login">
          <button type="submit" id="submitSignUpBtn" class="order-btn">Registriraj se</button>
          <button type="button" id="cancelSignUpBtn" onclick="window.location.href='index.html'">Odustani</button>
        </div>

      </form>

      <div class="form-footer">
        <p>Već imate račun? <a href="/login.html">Prijavite se ovdje</a></p>
      </div>

    </div>
  </main>

  <script src="signUp.js"></script>
</body>
</html>
