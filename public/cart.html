<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="format-detection" content="telephone=no">
    
    <title>Pizzeria Gema | Vaša Košarica</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body class="cart-page">

    <header class="top-bar">
        <a href="index.html" class="brand-link">
            <h1>Pizzeria Gema</h1>
        </a>

        <div class="nav-actions">
            <a href="tel:+38544521036" class="call-button" aria-label="Call Pizzeria Gema">
                <i class="fa-solid fa-phone"></i>
                <span class="phone-number">+385 44 521 036</span>
            </a>
            <a id="basketBtn" href="/cart.html" aria-label="View Cart" class="active-basket">
                <span id="basket">🛒</span>
            </a>
        </div>
    </header>

    <main class="checkout-wrapper">
        <div class="checkout-grid animate__animated animate__fadeIn">
            
            <section class="cart-items-section">
                <div class="cart-section-header">
                    <h2><i class="fa-solid fa-basket-shopping text-primary"></i> Vaša Košarica</h2>
                    <p>Pregledajte odabrana jela prije narudžbe</p>
                </div>
                
                <div class="cartContainer">
                    </div>
                
                <div class="continue-shopping">
                    <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Dodaj još pizza na meni</a>
                </div>
            </section>

            <section class="checkoutContainer">
                <div class="summary-card">
                    <h3>Pregled Narudžbe</h3>
                    <div class="summary-divider"></div>
                    
                    <div class="summary-row">
                        <span>Dostava:</span>
                        <span class="free-delivery">BESPLATNA</span>
                    </div>
                    
                    <div class="summary-divider"></div>
                    
                    <div class="total-row">
                        <span class="totalAmount">Ukupan Iznos / Total:</span>
                        <span class="price-highlight"><span id="totalAmount">0.00</span>€</span>
                    </div>
                    
                    <button class="checkoutBtn" type="button">
                        <i class="fa-solid fa-credit-card"></i> Dovrši Narudžbu / Checkout
                    </button>
                    
                    <div class="secure-checkout-notice">
                        <p><i class="fa-solid fa-shield-halved"></i> Brza i pouzdana dostava na vašu lokaciju.</p>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <script src="cart.js"></script>
</body>
</html>
